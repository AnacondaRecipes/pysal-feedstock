{% set name = "pysal" %}
{% set version = "26.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6cf0988412c2ac6441f08dc1ce6c2c28a58875eee6fd970b71cb689a9414d843

build:
  # even though package itself is for py>=310, it's dependency pinnings specified (e.g. mapclassify) are not
  # available for py310.
  skip: true  # [py<312]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - setuptools_scm >=6.2
    - toml
    - setuptools-scm >=6.2
  run:
    - python
    - lazy_loader >=0.3
    - beautifulsoup4 >=4.10
    - geopandas >=0.10.0
    - numpy >=1.22
    - packaging >=22
    - pandas >=1.4
    - platformdirs >=2.0.2
    - requests >=2.27
    - scipy >=1.8
    - shapely >=2.0.1
    - scikit-learn >=1.1
    - libpysal >=4.15.0
    - access >=1.1.10.post3
    - esda >=2.10.0
    - giddy >=2.3.8
    - inequality >=1.1.2
    - pointpats >=2.6.0
    - segregation >=2.5.5
    - spaghetti >=1.7.6
    - mgwr >=2.2.1
    - momepy >=1.0.0
    - spglm >=1.1.0
    - spint >=1.1.0
    - spreg >=1.9.0
    - tobler >=0.14.0
    - mapclassify >=2.10.0
    - splot >=1.1.7
    - spopt >=0.7.0
    - gwlearn >=0.1.1
    - spml >=0.2.2
  run_constrained:
    - joblib >=1.2
    - networkx >=2.7
    - numba >=0.55
    - pyarrow >=7.0
    - sqlalchemy >=2.0
    - xarray >=2022.3

test:
  source_files:
    - pysal/tests
  requires:
    - python
    - pip
    - pytest
    - urllib3 >=1.26
  imports:
    - pysal
    - pysal.viz
    - pysal.explore
    - pysal.model
    - pysal.lib
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv pysal/tests

about:
  home: https://github.com/pysal/pysal
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Library of spatial analysis functions
  description: |
    PySAL(Python Spatial Analysis Library) for spatial data science and the development of high level applications.
  doc_url: https://pysal.org/docs
  dev_url: https://github.com/pysal/pysal

extra:
  recipe-maintainers:
    - sjsrey
    - ocefpaf
    - mariusvniekerk
    - marcelotrevisani
